<div id="app"><nav id="nav" aria-label="Lab modules"></nav><main id="main"></main></div>
<button class="b p" id="fab" aria-label="Open lab controls">⚙ Lab Controls</button><div class="card" id="cmd"></div><div id="toast" role="status"></div>
<script>
const $=(s,r=document)=>r.querySelector(s),f=(v,d=2)=>isFinite(v)?Number(v).toFixed(d):'∞';
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200)};
/* ---------- signal engine ---------- */
const rng=s=>{s=s>>>0;return()=>((s=(s*1664525+1013904223)>>>0)/4294967296)};
const gauss=r=>Math.sqrt(-2*Math.log(r()+1e-12))*Math.cos(2*Math.PI*r());
const G=[[-.2,.12,.025,'P'],[-.035,-.12,.010,'Q'],[0,1,.011,'R'],[.035,-.25,.012,'S'],[.27,.3,.045,'T']];
function beats(p){const r=rng((p.seed||1)*7+1),rr0=60/p.hr;let t=.4;const b=[];while(t<p.dur+1){b.push(t);let k=1+.01*gauss(r);if(p.cond=='irr')k=1+.25*gauss(r);if(p.cond=='af')k=.6+.8*r();t+=Math.max(.3,rr0*k)}return b}
function ecg(p){const n=Math.round(p.fs*p.dur),x=new Float32Array(n),bs=beats(p),waves=[];
 bs.forEach((t0,bi)=>{const sc=Math.min(1,Math.sqrt(((bs[bi+1]||t0+.8)-t0)/.83));
  for(const[d,a,w,l]of G){if(p.cond=='af'&&l=='P')continue;const c=t0+d*sc;if(c<p.dur)waves.push({t:c,l});
   const i0=Math.max(0,Math.floor((c-4*w)*p.fs)),i1=Math.min(n-1,Math.ceil((c+4*w)*p.fs));for(let i=i0;i<=i1;i++){const u=(i/p.fs-c)/w;x[i]+=a*p.amp*Math.exp(-u*u/2)}}});
 if(p.cond=='af')for(let i=0;i<n;i++)x[i]+=.03*Math.sin(2*Math.PI*6.3*i/p.fs+3*Math.sin(i/p.fs*1.7));
 return{x,beats:bs.filter(t=>t<p.dur),waves}}
const NL=[0,.5,1.5,3.5];
function noisy(x,fs,lvl,type='all',seed=1){const m=NL[lvl],y=Float32Array.from(x);if(!m)return y;const r=rng(11+seed);
 for(let i=0;i<y.length;i++){const t=i/fs;let v=0;if(type=='all'||type=='gauss')v+=.03*m*gauss(r);if(type=='all'||type=='wander')v+=.12*m*Math.sin(2*Math.PI*.3*t);if(type=='all'||type=='line')v+=.04*m*Math.sin(2*Math.PI*50*t);if(type=='motion')v+=.5*m*Math.pow(Math.max(0,Math.sin(t*.9)),8)*Math.sin(2*Math.PI*3*t);y[i]+=v}return y}
function bq(type,f0,fs,Q=.7071){const w=2*Math.PI*f0/fs,c=Math.cos(w),a=Math.sin(w)/(2*Q);let b0,b1,b2;
 if(type=='lp'){b0=(1-c)/2;b1=1-c;b2=b0}else if(type=='hp'){b0=(1+c)/2;b1=-(1+c);b2=b0}else{b0=1;b1=-2*c;b2=1}
 const a0=1+a;return[b0/a0,b1/a0,b2/a0,-2*c/a0,(1-a)/a0]}
function run(c,x){const y=new Float32Array(x.length);let x1=0,x2=0,y1=0,y2=0;for(let i=0;i<x.length;i++){const v=c[0]*x[i]+c[1]*x1+c[2]*x2-c[3]*y1-c[4]*y2;x2=x1;x1=x[i];y2=y1;y1=v;y[i]=v}return y}
const zp=(c,x)=>run(c,run(c,x).reverse()).reverse();
function chain(F,fs){const c=[],ny=fs/2;if(F.hp&&F.hpF<ny)c.push(bq('hp',F.hpF,fs));if(F.lp&&F.lpF<ny)c.push(bq('lp',F.lpF,fs));if(F.nt&&F.nF<ny)c.push(bq('nt',F.nF,fs,8));return c}
const filt=(x,fs,F)=>chain(F,fs).reduce((y,c)=>zp(c,y),Float32Array.from(x));
function mag(c,fq,fs){const w=2*Math.PI*fq/fs,cr=Math.cos(w),ci=-Math.sin(w),c2r=Math.cos(2*w),c2i=-Math.sin(2*w);return Math.hypot(c[0]+c[1]*cr+c[2]*c2r,c[1]*ci+c[2]*c2i)/Math.hypot(1+c[3]*cr+c[4]*c2r,c[3]*ci+c[4]*c2i)}
function fft(re,im){const n=re.length;for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}}
 for(let l=2;l<=n;l<<=1){const a=-2*Math.PI/l,wr=Math.cos(a),wi=Math.sin(a);for(let i=0;i<n;i+=l){let cr=1,ci=0;for(let k=0;k<l/2;k++){const u=i+k,v=u+l/2,tr=re[v]*cr-im[v]*ci,ti=re[v]*ci+im[v]*cr;re[v]=re[u]-tr;im[v]=im[u]-ti;re[u]+=tr;im[u]+=ti;const t=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=t}}}}
function spec(x,N,win){const re=new Float64Array(N),im=new Float64Array(N),L=Math.min(N,x.length);let m=0;for(let i=0;i<L;i++)m+=x[i];m/=L;
 for(let i=0;i<L;i++){const w=win=='hamming'?.54-.46*Math.cos(2*Math.PI*i/(L-1)):win=='hann'?.5-.5*Math.cos(2*Math.PI*i/(L-1)):1;re[i]=(x[i]-m)*w}
 fft(re,im);const M=N/2,o=new Float32Array(M);for(let k=0;k<M;k++)o[k]=Math.hypot(re[k],im[k])/L;return o}
function rpeaks(x,fs){const b=filt(x,fs,{hp:1,hpF:5,lp:1,lpF:15}),s=new Float32Array(b.length),mi=new Float32Array(b.length),w=Math.max(1,Math.round(.12*fs));
 for(let i=1;i<b.length;i++){const d=b[i]-b[i-1];s[i]=d*d}let acc=0,mx=0;for(let i=0;i<s.length;i++){acc+=s[i];if(i>=w)acc-=s[i-w];mi[i]=acc/w;if(mi[i]>mx)mx=mi[i]}
 const th=.3*mx,refr=Math.round(.25*fs),pk=[];let i=0;
 while(i<mi.length){if(mi[i]>th){let j=i;while(j<mi.length&&mi[j]>th)j++;let k=i,best=-1e9;for(let q=Math.max(0,i-w);q<Math.min(b.length,j);q++)if(b[q]>best){best=b[q];k=q}if(!pk.length||k-pk[pk.length-1]>refr)pk.push(k);i=j}else i++}return pk}
function analyze(x,fs){const N=x.length;let s=0,e=0,mx=-1e9,mn=1e9;for(const v of x){s+=v;e+=v*v;if(v>mx)mx=v;if(v<mn)mn=v}
 const pk=rpeaks(x,fs),rr=[];for(let i=1;i<pk.length;i++)rr.push((pk[i]-pk[i-1])/fs);
 const m=rr.length?rr.reduce((a,b)=>a+b)/rr.length:0,sd=rr.length?Math.sqrt(rr.reduce((a,b)=>a+(b-m)**2,0)/rr.length):0;
 return{N,mean:s/N,rms:Math.sqrt(e/N),energy:e,power:e/N,max:mx,min:mn,pk,rr:m,sd,hr:m?60/m:0,cv:m?sd/m:0}}
function snr(a,b){let ps=0,pn=0;for(let i=0;i<a.length;i++){ps+=a[i]*a[i];const d=b[i]-a[i];pn+=d*d}return pn<1e-12?Infinity:10*Math.log10(ps/pn)}
function corr(a,b){const n=Math.min(a.length,b.length);let ma=0,mb=0;for(let i=0;i<n;i++){ma+=a[i];mb+=b[i]}ma/=n;mb/=n;let sab=0,sa=0,sb=0;for(let i=0;i<n;i++){sab+=(a[i]-ma)*(b[i]-mb);sa+=(a[i]-ma)**2;sb+=(b[i]-mb)**2}return sab/Math.sqrt(sa*sb||1)}
/* ---------- plotting ---------- */
function plot(cv,ser,o={}){const d=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;if(cv.width!=W*d||cv.height!=H*d){cv.width=W*d;cv.height=H*d}
 const g=cv.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,W,H);const cs=getComputedStyle(document.documentElement),mu=cs.getPropertyValue('--mu'),bd=cs.getPropertyValue('--bd');
 const x0=o.x0??Math.min(...ser.map(s=>s.x0||0)),x1=o.x1??Math.max(...ser.map(s=>(s.x0||0)+s.y.length*s.dx));let lo=o.ymin,hi=o.ymax;
 if(lo==null){lo=1e9;hi=-1e9;for(const s of ser){const a=Math.max(0,Math.floor((x0-(s.x0||0))/s.dx)),b=Math.min(s.y.length,Math.ceil((x1-(s.x0||0))/s.dx));for(let i=a;i<b;i++){const v=s.y[i];if(v<lo)lo=v;if(v>hi)hi=v}}if(lo>hi){lo=-1;hi=1}const p=(hi-lo)*.12||.5;lo-=p;hi+=p}
 const L=40,T=8,Bm=18,pw=W-L-6,ph=H-T-Bm,X=t=>L+(t-x0)/(x1-x0)*pw,Y=v=>T+(hi-v)/(hi-lo)*ph;
 g.font='10px system-ui';g.fillStyle=mu;g.strokeStyle=bd;g.lineWidth=1;const nx=Math.min(10,Math.max(2,Math.floor(pw/70)));
 for(let i=0;i<=nx;i++){const t=x0+(x1-x0)*i/nx,x=X(t);g.beginPath();g.moveTo(x,T);g.lineTo(x,T+ph);g.stroke();g.textAlign='center';g.fillText(t.toFixed(o.xd??1),x,H-5)}
 for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);g.beginPath();g.moveTo(L,y);g.lineTo(L+pw,y);g.stroke();g.textAlign='right';g.fillText(v.toFixed(2),L-4,y+3)}
 g.save();g.beginPath();g.rect(L,T,pw,ph);g.clip();
 ser.forEach(s=>{g.strokeStyle=s.c;g.lineWidth=s.w||1.6;g.globalAlpha=s.a||1;g.beginPath();const a=Math.max(0,Math.floor((x0-(s.x0||0))/s.dx)-1),b=Math.min(s.y.length,Math.ceil((x1-(s.x0||0))/s.dx)+1),st=Math.max(1,Math.floor((b-a)/(pw*1.5)));let first=1;
  for(let i=a;i<b;i+=st){const x=X((s.x0||0)+i*s.dx),y=Y(s.y[i]);first?(g.moveTo(x,y),first=0):g.lineTo(x,y)}g.stroke();g.globalAlpha=1;
  if(s.dots)for(let i=a;i<b;i++){g.fillStyle=s.c;g.beginPath();g.arc(X((s.x0||0)+i*s.dx),Y(s.y[i]),3,0,7);g.fill()}});g.restore();
 (o.marks||[]).forEach(m=>{if(m.t<x0||m.t>x1)return;const x=X(m.t),y=Y(m.v);g.fillStyle=m.c||'#ff6b6b';g.beginPath();g.arc(x,y,3.5,0,7);g.fill();g.font='bold 11px system-ui';g.textAlign='center';g.fillText(m.l||'',x,y+(m.dn?15:-8))});
 if(o.cursor!=null){const x=X(o.cursor);g.strokeStyle='#00E5A8';g.globalAlpha=.7;g.beginPath();g.moveTo(x,T);g.lineTo(x,T+ph);g.stroke();g.globalAlpha=1}
 g.font='11px system-ui';let lx=L+6;ser.forEach(s=>{if(!s.n)return;g.fillStyle=s.c;g.textAlign='left';const t='■ '+s.n;g.fillText(t,lx,T+12);lx+=g.measureText(t).width+12})}
/* ---------- state ---------- */
const DEF={hr:72,amp:1,fs:500,dur:10,cond:'nsr',noise:0,speed:1,seed:1},PRE={nsr:72,brady:48,tachy:125,irr:80,af:95};
const COND={nsr:'Normal Sinus Rhythm',brady:'Bradycardia',tachy:'Tachycardia',irr:'Irregular Rhythm',af:'AF-like Rhythm'},NZ=['OFF','Low','Medium','High'];
let S={...DEF},cur,B,view='dash',running=true,dirty=1,hd=4,OBS=LS.get('OBS',[]),P=LS.get('P',{}),QZ=LS.get('QZ',{}),PROF=LS.get('PROF',{}),HIST=LS.get('HIST',[]);
function build(p){const c=ecg(p),sig=noisy(c.x,p.fs,p.noise,'all',p.seed);return{p:{...p},clean:c.x,beats:c.beats,waves:c.waves,sig,an:analyze(sig,p.fs)}}
function rebuild(){cur=build(S);hd=Math.min(hd,S.dur);if(hd<4)hd=4;dirty=1}
const rhythm=()=>S.cond=='af'?'Irregularly irregular':cur.an.cv>.08?'Irregular':'Regular';
const quality=()=>{const s=snr(cur.clean,cur.sig);return s==Infinity?'Excellent':s>20?'Good':s>10?'Fair':'Poor'};
const mark=k=>{if(!P[k]){P[k]=1;LS.set('P',P)}};
/* ---------- helpers ---------- */
const sel=(k,opts,v,extra='')=>`<select data-k="${k}" ${extra} aria-label="${k}">${opts.map(([a,b])=>`<option value="${a}" ${a==v?'selected':''}>${b}</option>`).join('')}</select>`;
const sld=(k,l,mn,mx,st,v,u)=>`<label>${l}: <b id="o_${k}">${v}</b> ${u}<input type="range" data-k="${k}" min="${mn}" max="${mx}" step="${st}" value="${v}" aria-label="${l}"></label>`;
const TIP={bpm:'Beats per minute = 60 / R-R interval.',rr:'Time between successive R peaks.',rms:'Root-mean-square: effective (average) signal level.',snr:'Signal-to-noise ratio in dB: 10·log10(Psignal/Pnoise).'};
const tip=k=>`<span class="mu" title="${TIP[k]}" tabindex="0">ⓘ</span>`;
function upd(k,v){S[k]=v;if(k=='cond'){S.hr=PRE[v];const h=$('[data-k=hr]');if(h)h.value=S.hr}rebuild();const o=$('#o_'+k);if(o)o.textContent=v;const oh=$('#o_hr');if(oh)oh.textContent=S.hr;refresh()}
function bindCtl(root=document){root.querySelectorAll('[data-k]').forEach(e=>{if(!(e.dataset.k in DEF))return;e.addEventListener('input',()=>{const v=e.dataset.t=='s'||e.tagName=='SELECT'&&isNaN(e.value)?e.value:+e.value;upd(e.dataset.k,v)})})}
function tbl(h,rows){return`<div class="sc"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`}
async function dl(name,data){const d=window.claude?.use?await claude.use('downloads'):null;if(!d){toast('Downloads are unavailable in this view');return}try{await d.save({filename:name,data});toast('Saved '+name)}catch(e){toast(e.code=='declined'?'Download cancelled':'Download failed: '+(e.message||e.code))}}
/* ---------- views ---------- */
const V={};
V.dash={html:()=>`<div class="hero"><div class="mu" style="font-size:12px">EDUCATIONAL SIMULATION · SIGNALS & SYSTEMS</div><h1>ECG SIGNALS<br>& SYSTEMS<br><span style="color:var(--ac)">VIRTUAL LAB</span></h1><p>Generate. Manipulate. Analyze. Understand.</p>
<div class="row"><button class="b p" data-go="sim">START VIRTUAL EXPERIMENT</button><button class="b" data-go="theory">EXPLORE THEORY</button></div><canvas id="mini" style="height:130px;margin-top:14px"></canvas></div>
<div class="disc">Educational simulation only — not a medical diagnostic system.</div>
<div class="g4" id="dstats"></div><div class="g2" style="margin-top:12px"><div class="card"><h3>Laboratory progress <span id="pct"></span></h3><div id="prog"></div></div><div class="card"><h3>Achievements</h3><div id="badges"></div></div></div>
<div class="g4">${[['theory','ECG Fundamentals'],['ops','Signal Operations'],['flt','Noise & Filtering'],['fft','Fourier Transform'],['conv','Convolution'],['ana','ECG Analysis']].map(([k,n])=>`<div class="card chip" data-go="${k}"><h3>${n}</h3><span class="mu">Open module →</span></div>`).join('')}</div>`,

  plot($('#c1'),[{y:d.x,dx:d.dx,c:'#4dabf7',n:'x[k]'},{y:hs,dx:d.dx,c:'#ffa94d',n:'h[n−k]',w:2.2}],{x1:T,ymin:-xm*1.2,ymax:xm*1.2});plot($('#c2'),[{y:d.h,dx:d.dx,c:'#ffa94d'}],{x1:d.h.length*d.dx,xd:2});
  plot($('#c3'),[{y:d.y.slice(0,n+1),dx:d.dx,c:'#00E5A8'}],{x0:0,x1:d.y.length*d.dx,ymin:-ym,ymax:ym});$('#cn').textContent=`n = ${n} of ${d.y.length-1} · y[n] = ${f(d.y[n],4)} · output length = ${d.x.length} + ${d.h.length} − 1 = ${d.y.length}`}};

const SM={f:5,fs:12};
V.smp={html:()=>`<h2>Sampling & Nyquist Demonstration</h2><div class="card">${'<div class="g2"><div><label>Signal frequency: <b id="sf">'+SM.f+'</b> Hz<input type="range" id="sfr" min="1" max="40" value="'+SM.f+'"></label></div><div><label>Sampling frequency: <b id="ss">'+SM.fs+'</b> Hz<input type="range" id="ssr" min="4" max="200" value="'+SM.fs+'"></label></div></div>'}<div id="sinfo"></div></div><div class="card"><canvas id="sc" style="height:260px"></canvas></div>
<div class="card"><h3>ECG at different sampling rates (first 2 s)</h3><div class="row" id="sfsb">${[50,100,250,500,1000].map(v=>`<button class="b" data-sf="${v}">${v} Hz</button>`).join('')}</div><p id="sfi" class="mu"></p><canvas id="sc2" style="height:180px"></canvas></div>`,
 init(){$('#sfr').oninput=e=>{SM.f=+e.target.value;$('#sf').textContent=SM.f;V.smp.draw()};$('#ssr').oninput=e=>{SM.fs=+e.target.value;$('#ss').textContent=SM.fs;V.smp.draw()};document.querySelectorAll('[data-sf]').forEach(b=>b.onclick=()=>{SM.e=+b.dataset.sf;V.smp.draw()})},
 draw(){const{f:fq,fs}=SM,al=fs<2*fq,fa=Math.abs(fq-Math.round(fq/fs)*fs),nd=1000,ct=Array.from({length:nd},(_,i)=>Math.sin(2*Math.PI*fq*i/nd)),ns=Math.floor(fs),sm=Array.from({length:ns},(_,k)=>Math.sin(2*Math.PI*fq*k/fs));

  $('#sinfo').innerHTML=`<p>Nyquist frequency fN = Fs/2 = <b>${fs/2} Hz</b> · Ts = ${f(1000/fs,1)} ms · samples per second: ${ns}</p>`+(al?`<p class="err">⚠ Aliasing: Fs (${fs} Hz) &lt; 2·f (${2*fq} Hz). The samples appear as a ${f(fa,1)} Hz signal. Sampling frequency must be at least twice the highest signal frequency.</p>`:'<p class="ok">✓ Fs ≥ 2f — the signal can be reconstructed.</p>');
  const e=SM.e||500,c=ecg({...S,fs:e,dur:2,noise:0});plot($('#sc2'),[{y:c.x,dx:1/e,c:'#00E5A8'}],{x1:2});$('#sfi').textContent=`Fs = ${e} Hz · 10 s record = ${e*10} samples · Ts = ${f(1000/e,1)} ms · Nyquist = ${e/2} Hz`+(e<100?' · below 2×40 Hz: ECG detail is lost':'')}};

V.ana={html:()=>`<h2>Analysis Lab</h2><div class="g2"><div class="card"><h3>R-peak detection (band-pass → derivative → square → moving integration → threshold)</h3><canvas id="a1"></canvas><p id="apk"></p></div><div class="card"><h3>Computed parameters ${tip('rms')}</h3><div id="at"></div></div></div>
<div class="g2"><div class="card"><h3>Formula calculators</h3><label>R-R (s) → HR<input id="k1" type="number" value="0.83" step="0.01"></label><p class="ok" id="r1"></p><label>Fs (Hz) → Ts, Nyquist<input id="k2" type="number" value="500"></label><p class="ok" id="r2"></p><label>N samples → Δf = Fs/N (uses Fs above)<input id="k3" type="number" value="1024"></label><p class="ok" id="r3"></p></div>
<div class="card"><h3>Formulas</h3><p>HR=60/RR · Ts=1/Fs · fN=Fs/2 · x<sub>RMS</sub>=√((1/N)Σx²) · E=Σ|x|² · P=(1/N)Σ|x|² · SNR=10log₁₀(Ps/Pn)</p><p class="mu">Energy signals have finite E (transients); power signals have finite average power and infinite energy (a continuing ECG).</p><p class="mu">Educational simulation only — not diagnostic.</p></div></div>`,

 $('#apk').innerHTML=`Detected R-peaks: <b>${a.pk.length}</b> · Average R-R: <b>${f(a.rr,2)} s</b> · Estimated HR: <b>${f(a.hr,0)} BPM</b> · true beats: ${cur.beats.length}`;
 $('#at').innerHTML=tbl(['Parameter','Value'],[['Heart rate',f(a.hr,1)+' BPM'],['R-R interval',f(a.rr,3)+' s'],['R-R variability (SD)',f(a.sd*1000,1)+' ms'],['Peak / min amplitude',f(a.max,3)+' / '+f(a.min,3)+' mV'],['Mean',f(a.mean,4)],['RMS',f(a.rms,4)],['Energy',f(a.energy,1)],['Average power',f(a.power,4)],['Duration',S.dur+' s'],['Fs / samples',S.fs+' Hz / '+a.N],['SNR vs clean',f(snr(cur.clean,cur.sig),1)+' dB'],['Frequency resolution (N=1024)',f(S.fs/1024,3)+' Hz']]);V.ana.calc()}};
/* quiz */
const BANK={pre:[['Which wave represents atrial depolarization?',['T wave','P wave','QRS complex','U wave'],1,'The P wave marks atrial depolarization.'],['The QRS complex represents…',['Atrial repolarization','Ventricular depolarization','Ventricular repolarization','SA node firing'],1,'QRS = ventricular depolarization.'],['If R-R = 0.8 s, heart rate is…',['60 BPM','75 BPM','80 BPM','100 BPM'],1,'HR = 60/0.8 = 75 BPM.'],['Nyquist frequency for Fs = 500 Hz is…',['125 Hz','250 Hz','500 Hz','1000 Hz'],1,'fN = Fs/2 = 250 Hz.'],['The Fourier transform reveals a signal\'s…',['Frequency content','Sampling period','Heart rate only','Phase of the heart'],0,'It decomposes a signal into frequency components.'],['Energy of x[n] = [1, 2, 3] is…',['6','14','3.67','36'],1,'1+4+9 = 14.'],['Convolving a 5-sample and a 3-sample sequence gives length…',['8','15','7','5'],2,'5+3−1 = 7.'],['Sampling below 2·fmax causes…',['Aliasing','Amplification','Filtering','Nothing'],0,'Under-sampling folds frequencies (aliasing).']],
 post:[['The T wave represents…',['Atrial depolarization','Ventricular repolarization','Ventricular depolarization','PR interval'],1,'T = ventricular repolarization.'],['When heart rate increases, R-R interval…',['Increases','Decreases','Stays same','Becomes zero'],1,'RR = 60/HR, so it falls.'],['If R-R interval is 0.75 s, heart rate is…',['60 BPM','75 BPM','80 BPM','90 BPM'],2,'60/0.75 = 80 BPM.'],['Δf for Fs = 1000 Hz and N = 2000 is…',['0.5 Hz','2 Hz','1 Hz','0.25 Hz'],0,'Δf = 1000/2000 = 0.5 Hz.'],['Average power of [1, 2, 3] is…',['14','4.67','6','2'],1,'14/3 ≈ 4.67.'],['x(t − 2) is x(t)…',['Advanced by 2 s','Delayed by 2 s','Scaled by 2','Reversed'],1,'Subtracting from t shifts the waveform right (delay).'],['Which filter best removes 50 Hz power-line interference?',['Notch','High-pass 0.5 Hz','All-pass','Differentiator'],0,'A notch filter rejects a narrow band.'],['RMS of [3, 4] is…',['2.5','3.54','5','7'],1,'√((9+16)/2) ≈ 3.54.']]};
const quiz=k=>({html:()=>{const r=QZ[k];return`<h2>${k=='pre'?'Pre':'Post'}-Test</h2><div class="card" id="qz">${BANK[k].map((q,i)=>`<div class="q"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}" ${r&&r.a[i]==j?'checked':''} ${r?'disabled':''}> ${o}</label>`).join('')}<div class="mu" id="ex${i}" style="display:none"></div></div>`).join('')}<div class="row"><button class="b p" id="qs">${r?'Retake':'Submit'}</button><b id="qr"></b></div></div>`},

  QZ[k]={a,s:a.filter((v,i)=>v==BANK[k][i][2]).length};LS.set('QZ',QZ);mark(k);render()};
  if(r){$('#qr').textContent=`Score: ${r.s}/${BANK[k].length}`;BANK[k].forEach((q,i)=>{const e=$('#ex'+i);e.style.display='block';const ok=r.a[i]==q[2];e.innerHTML=`<span class="${ok?'ok':'err'}">${ok?'✓ Correct':'✗ Incorrect — answer: '+q[1][q[2]]}</span>. ${q[3]}`})}}});
V.pre=quiz('pre');V.post=quiz('post');

function conclusion(){const a=cur.an,b=B.an,p=B.p;let t=`The simulated ECG (${COND[S.cond]}) was generated at ${S.hr} BPM with Fs = ${S.fs} Hz. `;
 t+=p.hr!=S.hr?`Compared with the BEFORE signal (${p.hr} BPM), the R-R interval changed from ${f(b.rr,2)} s to ${f(a.rr,2)} s, confirming HR = 60/RR. `:'';t+=S.noise?`Noise (${NZ[S.noise]}) reduced SNR to ${f(snr(cur.clean,cur.sig),1)} dB. `:'';
 const s=sigs();t+=F.lvl?`Filtering (${F.hp?'HP ':''}${F.lp?'LP ':''}${F.nt?'Notch':''}) changed SNR from ${f(snr(s.cl,s.nz),1)} to ${f(snr(s.cl,s.fl),1)} dB. `:'';t+=`The R-peak detector found ${a.pk.length} peaks; RMS = ${f(a.rms,3)}, average power = ${f(a.power,4)}. FFT analysis showed the ECG energy concentrated at low frequencies. Educational simulation only.`;return t}
const pr=k=>QZ[k]?QZ[k].s+'/'+BANK[k].length:'not taken';
function payload(){return{student:PROF,date:new Date().toISOString(),title:'Generation and Analysis of ECG Signal',params:S,before:{p:B.p,hr:B.an.hr,rr:B.an.rr,rms:B.an.rms,energy:B.an.energy,power:B.an.power},after:{hr:cur.an.hr,rr:cur.an.rr,rms:cur.an.rms,energy:cur.an.energy,power:cur.an.power},observations:OBS,pre:QZ.pre?.s??null,post:QZ.post?.s??null,conclusion:conclusion()}}
function reportHTML(){const p=payload(),o=OBS.map((r,i)=>`<tr><td>${i+1}</td><td>${r.c}</td><td>${r.hr}</td><td>${r.rr}</td><td>${r.amp}</td><td>${r.fs}</td><td>${r.nz}</td><td>${r.rms}</td><td>${r.en}</td><td>${r.pw}</td><td>${r.rh}</td><td>${r.ob}</td></tr>`).join('');
 return`<!DOCTYPE html><html><head><meta charset="utf-8"><title>ECG Lab Report</title><style>body{font:14px system-ui;max-width:800px;margin:20px auto;padding:0 12px}table{border-collapse:collapse;width:100%;font-size:12px}td,th{border:1px solid #999;padding:4px}h1,h2{color:#064}</style></head><body><h1>Generation and Analysis of ECG Signal</h1><p>Student: ${PROF.name||'-'} · PRN: ${PROF.prn||'-'} · ${PROF.college||'-'} · ${PROF.branch||'-'} · Sem ${PROF.sem||'-'}<br>Date: ${new Date().toLocaleString()}</p><p><i>Educational simulation only — not a medical diagnostic system.</i></p>
<h2>Objective</h2><p>To generate and analyze a simulated ECG signal and study the relationship between heart rate, R-R interval, waveform morphology and signal characteristics.</p><h2>Theory</h2><p>HR = 60/RR; RMS = √((1/N)Σx²); E = Σ|x|²; P = E/N; Δf = Fs/N; fN = Fs/2.</p>
<h2>Parameters</h2><p>${COND[S.cond]}, HR ${S.hr} BPM, amplitude ×${S.amp}, Fs ${S.fs} Hz, ${S.dur} s, noise ${NZ[S.noise]}</p><h2>Before vs After</h2><table><tr><th></th><th>HR</th><th>R-R</th><th>RMS</th><th>Energy</th><th>Power</th></tr><tr><td>Before</td><td>${f(p.before.hr,1)}</td><td>${f(p.before.rr,3)}</td><td>${f(p.before.rms,4)}</td><td>${f(p.before.energy,1)}</td><td>${f(p.before.power,4)}</td></tr><tr><td>After</td><td>${f(p.after.hr,1)}</td><td>${f(p.after.rr,3)}</td><td>${f(p.after.rms,4)}</td><td>${f(p.after.energy,1)}</td><td>${f(p.after.power,4)}</td></tr></table>
<h2>Observations</h2><table><tr><th>No</th><th>Condition</th><th>HR</th><th>R-R</th><th>Amp</th><th>Fs</th><th>Noise</th><th>RMS</th><th>Energy</th><th>Power</th><th>Rhythm</th><th>Note</th></tr>${o}</table><h2>Quiz</h2><p>Pre-test: ${pr('pre')} · Post-test: ${pr('post')}</p><h2>Conclusion</h2><p>${p.conclusion}</p></body></html>`}
function saveExp(){HIST.unshift({d:new Date().toLocaleString(),c:COND[S.cond],hr:f(cur.an.hr,0),rr:f(cur.an.rr,2),sc:pr('pre')+' → '+pr('post'),S:{...S}});HIST=HIST.slice(0,20);LS.set('HIST',HIST);toast('Experiment saved locally')}
V.res={html:()=>{const pre=QZ.pre?.s,post=QZ.post?.s,imp=pre!=null&&post!=null?(pre?f((post-pre)/pre*100,0)+'%':'n/a'):'—';return`<h2>Results & Report</h2><div class="card"><h3>Student profile (saved locally)</h3><div class="row">${[['name','Name'],['prn','PRN / Roll'],['college','College'],['branch','Branch'],['sem','Semester']].map(([k,l])=>`<input data-pf="${k}" placeholder="${l}" value="${PROF[k]||''}" aria-label="${l}">`).join('')}</div></div>
<div class="card"><h3>Summary</h3><p><b>Objective:</b> Generate and analyze a simulated ECG signal and study HR, R-R interval, morphology and signal characteristics.</p><p>Pre-test: <b>${pr('pre')}</b> · Post-test: <b>${pr('post')}</b> · Improvement: <b class="ok">${imp}</b></p><p><b>Conclusion:</b> ${conclusion()}</p></div>
<div class="card"><h3>Observation table</h3><div class="sc"><table><tr><th>No</th><th>Condition</th><th>HR</th><th>R-R</th><th>Amp</th><th>Fs</th><th>Noise</th><th>RMS</th><th>Energy</th><th>Power</th><th>Rhythm</th><th>Observation</th><th></th></tr>${OBS.map((r,i)=>`<tr><td>${i+1}</td><td><input data-o="${i}.c" value="${r.c}" size="14"></td><td>${r.hr}</td><td>${r.rr}</td><td>${r.amp}</td><td>${r.fs}</td><td>${r.nz}</td><td>${r.rms}</td><td>${r.en}</td><td>${r.pw}</td><td>${r.rh}</td><td><input data-o="${i}.ob" value="${r.ob}" size="18" placeholder="Note"></td><td><button class="b" data-del="${i}" aria-label="Delete row">✕</button></td></tr>`).join('')||'<tr><td colspan="13" class="mu">No rows yet — add from the Simulator or below.</td></tr>'}</table></div><div class="row" style="margin-top:8px"><button class="b p" id="ar">+ Add row from current signal</button></div></div>
<div class="card"><h3>Export</h3><div class="row"><button class="b p" id="xh">Download report (HTML → print to PDF)</button><button class="b" id="xc">Download CSV</button><button class="b" id="xj">Download JSON</button><button class="b" id="xs">Save experiment</button></div></div>

  $('#xh').onclick=()=>dl('ecg-lab-report.html',reportHTML());$('#xc').onclick=()=>dl('ecg-observations.csv',['No,Condition,HR,RR,Amp,Fs,Noise,RMS,Energy,Power,Rhythm,Observation'].concat(OBS.map((r,i)=>[i+1,r.c,r.hr,r.rr,r.amp,r.fs,r.nz,r.rms,r.en,r.pw,r.rh,r.ob].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))).join('\n'));
  $('#xj').onclick=()=>dl('ecg-experiment.json',JSON.stringify(payload(),null,2));$('#xs').onclick=()=>{saveExp();render()};
  document.querySelectorAll('[data-hdel]').forEach(b=>b.onclick=()=>{HIST.splice(+b.dataset.hdel,1);LS.set('HIST',HIST);render()});document.querySelectorAll('[data-hop]').forEach(b=>b.onclick=()=>{S={...HIST[+b.dataset.hop].S};rebuild();go('sim')})}};

const NAV=[['dash','Dashboard'],['theory','Theory'],['pre','Pre-Test'],['sim','Simulator'],['ops','Signal Ops'],['flt','Filtering'],['fft','Fourier'],['conv','Convolution'],['smp','Sampling'],['ana','Analysis'],['post','Post-Test'],['res','Results']];
function renderNav(){$('#nav').innerHTML=`<h1>ECG SIGNALS & SYSTEMS<br>VIRTUAL LAB</h1><small>Interactive simulation and analysis of ECG signals</small>`+NAV.map(([k,n])=>`<button data-go="${k}" class="${k==view?'on':''}" ${k==view?'aria-current="page"':''}>${n}</button>`).join('')+`<button id="th">◐ Theme</button>`;$('#th').onclick=()=>{const t=document.documentElement.dataset.theme=='light'?'dark':'light';document.documentElement.dataset.theme=t;LS.set('theme',t);dirty=1;refresh()}}

const CMD=[['Start',()=>{running=true;dirty=1}],['Pause',()=>running=false],['Reset',resetAll],['Add noise',()=>{upd('noise',Math.min(3,S.noise+1))}],['Apply filter',()=>go('flt')],['Run FFT',()=>go('fft')],['Analyze',()=>go('ana')],['Save experiment',()=>{saveExp()}],['Export report',()=>{go('res')}]];
$('#cmd').innerHTML=CMD.map(([n],i)=>`<button class="b" style="width:100%;margin:2px 0" data-c="${i}">${n}</button>`).join('');
$('#cmd').addEventListener('click',e=>{const i=e.target.dataset.c;if(i!=null){CMD[i][1]();toast(CMD[i][0])}});$('#fab').onclick=()=>{const c=$('#cmd');c.style.display=c.style.display=='block'?'none':'block'};
/* animation loop */
let last=0,lastUI=0;
function drawScope(id){const cv=$(id);if(!cv||!cur)return;const W=id=='#mini'?3:4,x0=hd-W,fs=S.fs,few=cur.beats.filter(t=>t>x0&&t<hd).length<=5&&id!='#mini',a=cur.an;
 const marks=cur.waves.filter(w=>w.t>=x0&&w.t<=hd&&(few||w.l=='R')).map(w=>({t:w.t,v:cur.sig[Math.min(cur.sig.length-1,Math.round(w.t*fs))],l:w.l,c:w.l=='R'?'#ff6b6b':'#ffa94d',dn:w.l=='Q'||w.l=='S'}));
 plot(cv,[{y:cur.sig,dx:1/fs,c:'#00E5A8',w:1.8}],{x0,x1:hd,marks,cursor:hd,ymin:a.min-.25,ymax:a.max+.25})}
function loop(ts){const dt=Math.min(.1,(ts-last)/1000);last=ts;
 if(running&&(view=='sim'||view=='dash')){hd+=dt*S.speed;if(hd>S.dur)hd=4;dirty=1}
 if(view=='conv'&&CV.play){CV.n+=dt*45;const L=convData().y.length-1;if(CV.n>=L){CV.n=L;CV.play=0}V.conv.draw()}
 if(dirty){if(view=='sim')drawScope('#scope');if(view=='dash')drawScope('#mini');dirty=0}
 if(ts-lastUI>250){lastUI=ts;const c=$('#cyc');if(c)c.textContent=cur.beats.filter(t=>t<=hd).length}

document.documentElement.dataset.theme=LS.get('theme','dark');
B=build(DEF);rebuild();render();V.ana.calc&&0;requestAnimationFrame(loop);
